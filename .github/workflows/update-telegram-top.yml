name: Update Telegram top posts

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS payload
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/update_telegram_posts.py'
      - '.github/workflows/update-telegram-top.yml'

permissions:
  contents: write

concurrency:
  group: telegram-top-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Refresh Telegram ranking
        run: python scripts/update_telegram_posts.py

      - name: Commit updated ranking
        shell: bash
        run: |
          if git diff --quiet -- data/telegram-posts.json; then
            echo 'Telegram ranking is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/telegram-posts.json
          git commit -m 'Refresh Telegram top posts'
          git push
