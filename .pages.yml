media:
  - name: education_documents
    label: Дипломы и сертификаты
    input: images/diplomas/uploads
    output: /images/diplomas/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  - name: site_images
    label: Фото сайта
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

content:
  - name: education_documents
    label: Дипломы и сертификаты
    type: file
    path: data/education-documents.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: retraining
        label: Базовая подготовка
        type: object
        fields:
          - name: document
            label: Профпереподготовка — психология и психологическое консультирование, 2019
            type: image
            description: Загрузите исходную фотографию целиком. Отдельное превью делать не нужно.
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: eot
        label: Эмоционально-образная терапия
        type: object
        fields:
          - name: stage1
            label: 1-я ступень, 2018
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stage2
            label: 2-я ступень, 2018
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stage3
            label: 3-я ступень, 2019
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stage3_repeat
            label: 3-я ступень — повторное прохождение, 2021
            type: image
            description: Это второй отдельный документ о прохождении 3-й ступени.
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: inner_child
        label: Внутренний ребёнок и внутренний родитель
        type: object
        fields:
          - name: stage1
            label: 1-я ступень, 2020
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stage2
            label: 2-я ступень, 2020
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stage3
            label: 3-я ступень, 2021
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: orkt
        label: ОРКТ
        type: object
        fields:
          - name: document
            label: Краткосрочное психологическое консультирование, ориентированное на решение, 2024
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe

      - name: supervision
        label: Супервизия
        type: object
        fields:
          - name: document
            label: Обучение супервизии, 190 часов, 2025
            type: image
            options:
              media: education_documents
              extensions: [jpg, jpeg, png, webp]
              rename: safe

  - name: offer
    label: Оферта
    type: file
    path: data/offer.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: updated
        label: Дата редакции
        type: date
      - name: body
        label: Текст оферты
        type: rich-text
        options:
          format: html
          media: false
          switcher: true

  - name: site_settings
    label: Настройки сайта
    type: file
    path: data/site-settings.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: contacts
        label: Контакты
        type: object
        fields:
          - name: booking_telegram
            label: Telegram для записи
            type: string
          - name: channel
            label: Telegram-канал
            type: string
          - name: email
            label: Электронная почта
            type: string
      - name: practice
        label: Практика и формат
        type: object
        fields:
          - name: audience_text
            label: С кем работаю
            type: text
          - name: not_work_with
            label: С кем не работаю
            type: text
          - name: city
            label: Город очной работы
            type: string
      - name: services
        label: Услуги и цены
        type: object
        fields:
          - name: consultation_online
            label: Индивидуальная консультация онлайн
            type: object
            fields:
              - name: enabled
                label: Показывать
                type: boolean
              - name: title
                label: Название
                type: string
              - name: price
                label: Цена
                type: number
              - name: currency
                label: Валюта
                type: string
              - name: duration
                label: Длительность
                type: string
              - name: platform
                label: Платформа
                type: string
          - name: consultation_offline
            label: Индивидуальная консультация очно
            type: object
            fields:
              - name: enabled
                label: Показывать
                type: boolean
              - name: title
                label: Название
                type: string
              - name: price
                label: Цена
                type: number
              - name: currency
                label: Валюта
                type: string
              - name: duration
                label: Длительность
                type: string
              - name: location
                label: Место
                type: string
          - name: supervision
            label: Супервизия
            type: object
            fields:
              - name: enabled
                label: Показывать
                type: boolean
              - name: title
                label: Название
                type: string
              - name: price
                label: Цена
                type: number
              - name: currency
                label: Валюта
                type: string
              - name: duration
                label: Длительность
                type: string
              - name: platform
                label: Платформа
                type: string
      - name: payment_note
        label: Примечание об оплате
        type: text
      - name: organization
        label: Условия работы
        type: object
        fields:
          - name: booking
            label: Запись
            type: text
          - name: cancellation
            label: Перенос и отмена
            type: text
          - name: payment
            label: Оплата
            type: text
          - name: therapist_cancellation
            label: Если встречу переношу я
            type: text
          - name: data
            label: Связь и данные
            type: text
          - name: consultation
            label: О консультации
            type: text
          - name: note
            label: Примечание под условиями
            type: text
      - name: education
        label: Текущий статус образования
        type: object
        fields:
          - name: master_title
            label: Название строки
            type: string
          - name: master_text
            label: Статус магистратуры
            type: string
      - name: photo
        label: Фото
        type: object
        fields:
          - name: portrait
            label: Основной портрет
            type: image
            options:
              media: site_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: portrait_alt
            label: Подпись для доступности
            type: string
      - name: promotions
        label: Акции по расписанию
        description: Можно заранее создать акции на месяцы вперёд. На сайте автоматически показываются только включённые акции, у которых текущая дата попадает между датой начала и датой окончания.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {start_date} — {end_date}"
        fields:
          - name: enabled
            label: Включить
            type: boolean
          - name: label
            label: Тема акции
            type: string
            required: true
          - name: consultation_price
            label: Цена консультации
            type: number
            required: true
          - name: start_date
            label: Показывать с
            type: date
            required: true
          - name: end_date
            label: Показывать до
            type: date
            required: true

  - name: telegram_posts
    label: Telegram — топ постов
    description: Статистика обновляется автоматически. Автоотбор оставляет содержательные материалы о психологии, теле и исследованиях. Для каждого поста можно переопределить показ, заголовок и рубрику.
    type: file
    path: data/telegram-posts.json
    format: json
    list: true
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: mode
        label: Режим показа
        type: select
        options:
          values:
            - name: auto
              label: Автоматически
            - name: include
              label: Всегда показывать
            - name: exclude
              label: Никогда не показывать
      - name: show
        label: Сейчас показывается
        type: boolean
        readonly: true
      - name: custom_title
        label: Свой заголовок для сайта
        description: Оставьте пустым, чтобы использовать автоматически взятый заголовок поста.
        type: string
      - name: custom_topic
        label: Своя рубрика
        description: Оставьте пустым, чтобы использовать автоматически определённую рубрику.
        type: string
      - name: title
        label: Автоматический заголовок
        type: string
        readonly: true
      - name: topic
        label: Автоматическая рубрика
        type: string
        readonly: true
      - name: id
        label: ID поста
        type: number
        readonly: true
      - name: url
        label: Ссылка
        type: string
        readonly: true
      - name: reactions
        label: Реакции
        type: number
        readonly: true
      - name: views
        label: Просмотры
        type: number
        readonly: true
      - name: score
        label: Рейтинг
        type: number
        readonly: true
      - name: auto_info
        label: "Автофильтр: информационный"
        type: boolean
        readonly: true
      - name: date
        label: Дата Telegram
        type: string
        readonly: true
      - name: text_preview
        label: Фрагмент поста
        type: text
        readonly: true

actions:
  - name: refresh_telegram
    label: Обновить топ Telegram
    workflow: update-telegram-top.yml
    confirm:
      title: Обновить рейтинг постов?
      message: Будут заново собраны публичные просмотры и реакции Telegram. Ваши правки заголовков, рубрик и переключателей сохранятся.
      button: Обновить
